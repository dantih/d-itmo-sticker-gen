[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sticker-gen"
version = "1.0.0"
description = "Генератор наклеек с QR-кодом для помещений ИТМО"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pdf2image>=1.17",
    "PyPDF2>=3.0",
    "qrcode[pil]>=8.0",
    "Pillow>=10.0",
    "reportlab>=4.0",
]

[project.scripts]
sticker-gen = "sticker_gen:main"

[tool.setuptools.packages.find]
include = ["sticker_gen", "sticker_gen.*"]

[tool.setuptools.package-data]
sticker_gen = ["templates/*"]

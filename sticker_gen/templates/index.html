<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор наклеек с QR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
            padding: 40px;
            max-width: 640px;
            width: 100%;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #111827;
            letter-spacing: -0.3px;
        }
        .subtitle {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .preview-section {
            background: #f9fafb;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .preview-label {
            font-size: 12px;
            font-weight: 500;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .sticker-canvas-wrap {
            width: 100%;
            max-width: 520px;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 1px 6px rgba(0,0,0,0.04), inset 0 0 0 1px #e5e7eb;
            overflow: hidden;
            position: relative;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sticker-canvas-wrap canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        .sticker-placeholder {
            color: #9ca3af;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
            padding: 24px 12px;
        }
        .sticker-info {
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #374151;
        }
        .sticker-info.visible {
            display: flex;
        }
        .sticker-info .size {
            color: #6b7280;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            background: #fff;
            color: #111827;
        }
        .input-row input:focus {
            border-color: #0a0a0a;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.08);
        }
        .input-row input::placeholder {
            color: #9ca3af;
        }
        @media (max-width: 500px) {
            .input-row {
                flex-direction: column;
            }
            .input-row .btn {
                width: 100%;
                min-width: unset;
            }
            .card {
                padding: 20px;
            }
            .action-row {
                flex-direction: column;
            }
            .action-row .btn {
                width: 100%;
            }
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn-primary {
            background: #0a0a0a;
            color: #fff;
            min-width: 140px;
        }
        .btn-primary:hover {
            background: #1f2937;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-success {
            background: #059669;
            color: #fff;
        }
        .btn-success:hover {
            background: #047857;
        }
        .btn-success:active {
            transform: scale(0.97);
        }
        .btn-outline {
            background: transparent;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 10px 16px;
        }
        .btn-outline:hover {
            background: #f9fafb;
        }
        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }
        .error.visible {
            display: block;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }
        .footer a {
            color: #6b7280;
            text-decoration: none;
        }
        .footer a:hover {
            color: #111827;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="logo">qr</div>
            <h1>Наклейка с QR</h1>
        </div>
        <p class="subtitle">Сгенерируй PDF-наклейку со ссылкой для уборки или ремонта помещения</p>

        <div class="preview-section">
            <div class="preview-label">Предпросмотр наклейки</div>
            <div class="sticker-canvas-wrap" id="stickerWrap">
                <div class="sticker-placeholder" id="stickerPlaceholder">
                    Вставь ссылку и нажми<br>«Сгенерировать»
                </div>
                <canvas id="stickerCanvas" style="display:none"></canvas>
            </div>
            <div class="sticker-info" id="stickerInfo">
                <span>✅ PDF сгенерирован</span>
                <span class="size" id="fileSize"></span>
            </div>
        </div>

        <div class="input-group">
            <label for="urlInput">Ссылка для QR-кода</label>
            <div class="input-row">
                <input type="url" id="urlInput"
                       placeholder="https://forms.yandex.ru/u/..."
                       autocomplete="url"
                       spellcheck="false">
                <button class="btn btn-primary" id="generateBtn" onclick="generate()">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M13.5 11.5v2a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-2M8 10V2.5M5 5.5l3-3 3 3"
                              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                              stroke-linejoin="round"/>
                    </svg>
                    Сгенерировать
                </button>
            </div>
            <div class="input-group">
                <label for="captionInput">Подпись (мелкий текст снизу — чтобы не запутаться при расклейке)</label>
                <div class="input-row">
                    <input type="text" id="captionInput"
                           placeholder="Коворкинг «Альфа», 3 этаж"
                           autocomplete="off">
                </div>
            </div>
            <div class="error" id="errorMsg"></div>
            <div class="action-row" id="actionRow" style="display:none">
                <button class="btn btn-success" onclick="downloadPdf()" id="btnDownloadSingle">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M13.5 11.5v2a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-2M8 10V2.5M5 5.5l3-3 3 3"
                              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                              stroke-linejoin="round"/>
                    </svg>
                    Скачать PDF
                </button>
                <button class="btn btn-success" onclick="downloadPdfA4()" id="btnDownloadA4" style="display:none">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M13.5 11.5v2a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-2M8 10V2.5M5 5.5l3-3 3 3"
                              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                              stroke-linejoin="round"/>
                    </svg>
                    Скачать PDF A4
                </button>
                <button class="btn btn-outline" onclick="document.getElementById('urlInput').select();document.getElementById('urlInput').focus()">
                    Создать ещё
                </button>
            </div>
        </div>

        <div class="footer">
            <span>110 × 35 мм</span>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const API_URL = window.location.origin + '/generate';

        const btn = document.getElementById('generateBtn');
        const input = document.getElementById('urlInput');
        const placeholder = document.getElementById('stickerPlaceholder');
        const canvas = document.getElementById('stickerCanvas');
        const wrap = document.getElementById('stickerWrap');
        const info = document.getElementById('stickerInfo');
        const fileSize = document.getElementById('fileSize');
        const error = document.getElementById('errorMsg');
        const actionRow = document.getElementById('actionRow');

        let currentBlob = null;
        let currentFilename = 'sticker.pdf';

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') generate();
        });

        function setLoading(loading) {
            btn.disabled = loading;
            btn.innerHTML = loading
                ? '<span class="spinner"></span> Генерация…'
                : '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 11.5v2a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-2M8 10V2.5M5 5.5l3-3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Сгенерировать';
        }

        function showError(msg) {
            error.textContent = msg;
            error.classList.add('visible');
        }

        function hideError() {
            error.classList.remove('visible');
        }

        async function renderPdfPreview(blob) {
            const arrayBuffer = await blob.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const page = await pdf.getPage(1);

            // Определяем размер для отрисовки
            const wrapWidth = wrap.clientWidth - 2; // minus border
            const viewport = page.getViewport({ scale: 1 });
            const scale = Math.min(wrapWidth / viewport.width, 400 / viewport.height);
            const scaled = page.getViewport({ scale });

            canvas.width = scaled.width;
            canvas.height = scaled.height;
            canvas.style.display = 'block';
            canvas.style.width = wrapWidth + 'px';
            canvas.style.height = (wrapWidth * scaled.height / scaled.width) + 'px';

            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport: scaled }).promise;

            placeholder.style.display = 'none';
        }

        async function generate() {
            hideError();
            const url = input.value.trim();

            if (!url) {
                showError('Вставь ссылку');
                input.focus();
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://') &&
                !url.startsWith('tg://') && !url.startsWith('itmo://')) {
                showError('Ссылка должна начинаться с http://, https://, tg:// или itmo://');
                return;
            }

            setLoading(true);
            actionRow.style.display = 'none';
            info.classList.remove('visible');

            try {
                const cap = document.getElementById('captionInput').value.trim();
                const resp = await fetch(API_URL + '?url=' + encodeURIComponent(url) + '&caption=' + encodeURIComponent(cap));
                if (!resp.ok) {
                    const text = await resp.text();
                    throw new Error(text || `Ошибка ${resp.status}`);
                }

                const blob = await resp.blob();
                currentBlob = blob;
                currentFilename = resp.headers.get('Content-Disposition')
                    ?.match(/filename="?(.+?)"?$/)?.[1] || 'sticker.pdf';

                // Превью PDF
                try {
                    await renderPdfPreview(blob);
                } catch (pe) {
                    console.warn('PDF preview failed, showing fallback', pe);
                    placeholder.style.display = 'flex';
                    placeholder.innerHTML = '✅ PDF готов';
                }

                // Инфо
                fileSize.textContent = `${(blob.size / 1024).toFixed(1)} КБ`;
                info.classList.add('visible');

                // Кнопки действий
                actionRow.style.display = 'flex';
                document.getElementById('btnDownloadA4').style.display = 'flex';
                btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 11.5v2a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-2M8 10V2.5M5 5.5l3-3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Сгенерировать ещё';

            } catch (err) {
                showError(err.message || 'Ошибка генерации');
                console.error(err);
            } finally {
                setLoading(false);
            }
        }

        function downloadPdf() {
            if (!currentBlob) return;
            const link = document.createElement('a');
            link.href = URL.createObjectURL(currentBlob);
            link.download = currentFilename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(link.href), 10000);
        }

        async function downloadPdfA4() {
            const url = input.value.trim();
            if (!url) return;
            const cap = document.getElementById('captionInput').value.trim();

            try {
                const btnA4 = document.getElementById('btnDownloadA4');
                btnA4.disabled = true;
                btnA4.innerHTML = '<span class="spinner"></span> Генерация…';

                const resp = await fetch(API_URL + '?mode=a4&url=' + encodeURIComponent(url) + '&caption=' + encodeURIComponent(cap));
                if (!resp.ok) {
                    const text = await resp.text();
                    throw new Error(text || `Ошибка ${resp.status}`);
                }

                const blob = await resp.blob();
                let a4Filename = 'stickers_a4.pdf';
                const cd = resp.headers.get('Content-Disposition');
                if (cd) {
                    const m = cd.match(/filename="?(.+?)"?$/);
                    if (m) a4Filename = m[1];
                }
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = a4Filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(link.href), 10000);
            } catch (err) {
                showError(err.message || 'Ошибка генерации A4');
            } finally {
                const btnA4 = document.getElementById('btnDownloadA4');
                btnA4.disabled = false;
                btnA4.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 11.5v2a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-2M8 10V2.5M5 5.5l3-3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Скачать PDF A4';
            }
        }
    </script>
</body>
</html>
